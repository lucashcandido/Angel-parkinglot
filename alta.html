<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1d4ed8">
<title>Registro de cliente</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Registration for new customers, opened from the QR code. Nothing is stored here: the data goes
   to the owners as a WhatsApp message with a link that loads it into Cast Comercial. */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--on-accent:#fff;--err:#c62828;--wa:#128c4a}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--on-accent:#0b1020;--err:#f87171;--wa:#3ecf7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.field{margin-bottom:16px}
label.l{display:block;font-weight:650;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
.pay{display:grid;gap:8px}
.pay label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:600;cursor:pointer}
.pay input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.pay label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--err);font-weight:600;margin:4px 0 0;font-size:15px}
button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:15px;border:0;border-radius:14px;background:var(--wa);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0;text-align:center}
.done{text-align:center}
.done .big{font-size:44px;line-height:1}
.done a{color:var(--accent);font-weight:650}
</style>
</head>
<body>
<main>
  <h1 id="title">Registro de cliente</h1>
  <p class="lead" id="lead">Completá tus datos. Tarda menos de un minuto.</p>
  <form class="card" id="f" novalidate>
    <div class="field"><label class="l" for="n">Nombre y apellido</label><input id="n" type="text" autocomplete="name" autocapitalize="words" required></div>
    <div class="field"><label class="l" for="p">Teléfono (WhatsApp)</label><input id="p" type="tel" autocomplete="tel" inputmode="tel" placeholder="11 5555-0000" required></div>
    <div class="field"><label class="l" for="k">Patente</label><input id="k" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase" placeholder="AB 123 CD" required></div>
    <div class="field"><span class="l" style="display:block;font-weight:650;margin-bottom:6px">¿Cómo vas a pagar?</span>
      <div class="pay" role="radiogroup">
        <label><input type="radio" name="f" value="mp">Mercado Pago</label>
        <label><input type="radio" name="f" value="cash">Efectivo</label>
        <label><input type="radio" name="f" value="transfer">Transferencia bancaria</label>
      </div></div>
    <div id="e" class="err" role="alert"></div>
    <button type="submit"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span>Enviar por WhatsApp</span></button>
    <p class="hint">Se abre WhatsApp con tus datos; solo tenés que tocar «Enviar».</p>
  </form>
  <div class="card done" id="ok" hidden>
    <div class="big">✓</div>
    <h2>¡Gracias!</h2>
    <p>Si WhatsApp no se abrió, <a id="again" href="#" target="_blank" rel="noopener">tocá acá</a>.</p>
  </div>
</main>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var to = (q.get('to') || '').replace(/\D/g, '');
  var biz = (q.get('n') || '').trim().slice(0, 60);
  if(biz){ document.getElementById('title').textContent = 'Registro – ' + biz; document.title = 'Registro – ' + biz; }
  var $ = function(id){ return document.getElementById(id); };
  var PAY = { mp:'Mercado Pago', cash:'Efectivo', transfer:'Transferencia bancaria' };
  function plate(v){
    var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var m;
    if((m = /^([A-Z]{2})(\d{3})([A-Z]{2})$/.exec(s))) return m[1] + ' ' + m[2] + ' ' + m[3];
    if((m = /^([A-Z]{3})(\d{3})$/.exec(s))) return m[1] + ' ' + m[2];
    return s;
  }
  function b64url(obj){
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), bin = '';
    for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  if(!to){ $('e').textContent = 'Este código no está completo (falta el número de WhatsApp). Pedí el código nuevo en el estacionamiento.'; }
  $('k').addEventListener('blur', function(){ this.value = plate(this.value); });
  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var n = $('n').value.replace(/\s+/g, ' ').trim(), p = $('p').value.trim(), k = plate($('k').value), sel = document.querySelector('input[name=f]:checked');
    var fail = function(msg, id){ $('e').textContent = msg; if(id) $(id).focus(); };
    if(!to) return fail('Este código no está completo (falta el número de WhatsApp).');
    if(n.length < 2) return fail('Escribí tu nombre.', 'n');
    if(p.replace(/\D/g, '').length < 6) return fail('Escribí tu número de teléfono.', 'p');
    if(k.replace(/\s/g, '').length < 5) return fail('Escribí la patente.', 'k');
    if(!sel) return fail('Elegí cómo vas a pagar.');
    $('e').textContent = '';
    var link = new URL('./', location.href).href + '#alta=' + b64url({ v:1, n:n, p:p, k:k, f:sel.value, d:new Date().toISOString().slice(0, 10) });
    var text = 'Hola, quiero registrarme en el estacionamiento.\n\nNombre: ' + n + '\nTeléfono: ' + p + '\nPatente: ' + k + '\nPago: ' + PAY[sel.value] + '\n\nPara cargar mis datos en la app: ' + link;
    var url = 'https://wa.me/' + to + '?text=' + encodeURIComponent(text);
    $('again').href = url;
    $('f').hidden = true; $('lead').hidden = true; $('ok').hidden = false;
    location.href = url;
  });
})();
</script>
</body>
</html>

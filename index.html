<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkinglot Manager</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://api.anthropic.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parkinglot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --text:#171a21; --muted:#667085; --line:#e2e5eb; --soft:#f0f2f6;
  --accent:#1d4ed8; --accent-soft:#e3ebff; --on-accent:#ffffff;
  --paid:#15803d; --paid-soft:#dcf5e4;
  --unpaid:#c62828; --unpaid-soft:#fde4e4;
  --unclear:#b45309; --unclear-soft:#fdeed3;
  --partial:#0b6aa8; --partial-soft:#dceefb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#191d26; --text:#eef0f4; --muted:#98a2b3; --line:#2a303c; --soft:#222733;
    --accent:#6b93ff; --accent-soft:#1d2a4d; --on-accent:#0b1020;
    --paid:#4ade80; --paid-soft:#12301f;
    --unpaid:#f87171; --unpaid-soft:#3a1a1a;
    --unclear:#fbbf24; --unclear-soft:#3a2a0d;
    --partial:#56b6f0; --partial-soft:#0f2c42;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:8px}
.top h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.top h1 span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px;flex:none}
.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 11px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill .txt{display:grid}
.pill .txt>*{grid-area:1/1}
.pill .ghost{visibility:hidden}
.pill.ok .dot{background:var(--paid)} .pill.error .dot{background:var(--unpaid)}
.pill.pending .dot,.pill.offline .dot,.pill.local .dot{background:var(--unclear)}
.pill.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--card);color:var(--muted);padding:0 9px;min-height:34px;font-size:13px;font-weight:700}
.lang button.on{background:var(--accent);color:var(--on-accent)}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:104px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;line-height:1.2}
.tab b{display:block;font-size:15px;font-weight:650;white-space:nowrap}
.tab small{color:var(--muted);font-size:12px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab.on small{color:inherit;opacity:.85}

/* month */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.monthbar .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;flex:none}
.monthmid{text-align:center;min-width:0}
#monthLabel{font-size:21px;font-weight:750;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--accent);padding:2px 4px;font-size:13.5px;text-decoration:underline;text-underline-offset:2px}
.tag-now{font-size:12.5px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.summary{padding:14px 16px}
.sum-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sum-head .big{font-size:17px;font-weight:700}
.sum-head .money{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin-top:10px}
.bar i{display:block;height:100%}
.bar .p{background:var(--paid)} .bar .h{background:var(--partial)} .bar .c{background:var(--unclear)} .bar .u{background:var(--unpaid);opacity:.55}
.banner{margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--unclear-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.err{background:var(--unpaid-soft)}
.banner.info{background:var(--accent-soft);flex-wrap:nowrap;align-items:flex-start}
.banner.info .icon-btn{margin:-6px -8px -6px 0}
.login{max-width:460px;margin:22px auto;padding:24px 20px;text-align:center}
.login h2{font-size:22px}
.login p{color:var(--muted);margin:8px 0 14px}
.login input{font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;min-height:56px}
.login .btn{width:100%;margin-top:12px;min-height:52px;font-size:17px}
.login .link{margin-top:18px;color:var(--muted)}
.login .msg{text-align:left}
.code{font:700 23px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:12px 8px;border:1.5px dashed var(--muted);border-radius:12px;margin:8px 0;background:var(--card);-webkit-user-select:all;user-select:all}
body.locked .tabs,body.locked .monthbar,body.locked #summary,body.locked .toolbar,body.locked #switch,body.locked #lists{display:none}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 10px}
.toolbar input{flex:1 1 240px;min-width:0}
@media (max-width:560px){.toolbar .btn{flex:1}}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=tel],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none}
textarea{min-height:76px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;min-height:44px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--unpaid);border-color:var(--unpaid)}
.btn.small{min-height:36px;padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

/* list switch (phone) */
.switch{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.switch button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:7px 4px;font-size:13px;line-height:1.25;min-height:48px}
.switch button b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.switch button.on.paid{background:var(--paid-soft);border-color:var(--paid);color:var(--paid)}
.switch button.on.unpaid{background:var(--unpaid-soft);border-color:var(--unpaid);color:var(--unpaid)}
.switch button.on.unclear{background:var(--unclear-soft);border-color:var(--unclear);color:var(--unclear)}
.switch button.on.partial{background:var(--partial-soft);border-color:var(--partial);color:var(--partial)}

.lists{display:grid;gap:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.col{overflow:hidden}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.col-head .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.col-head .sum{font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.col-head .mark{width:10px;height:10px;border-radius:50%}
.col.partial .mark{background:var(--partial)} .col.partial .col-head{background:var(--partial-soft)}
.col.paid .mark{background:var(--paid)} .col.unpaid .mark{background:var(--unpaid)} .col.unclear .mark{background:var(--unclear)}
.col.paid .col-head{background:var(--paid-soft)} .col.unpaid .col-head{background:var(--unpaid-soft)} .col.unclear .col-head{background:var(--unclear-soft)}
.col ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 6px 10px 14px;display:block}
.row-main:hover{background:var(--soft)}
.row-name{display:block;font-weight:650;overflow-wrap:anywhere}
.row-sub{display:block;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.row-note{display:block;font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11.5px;font-weight:650;border-radius:6px;padding:1px 6px;vertical-align:1px;margin-left:4px;background:var(--soft);color:var(--muted)}
.badge.warn{background:var(--unpaid-soft);color:var(--unpaid)}
.plate{display:inline-block;font:700 12.5px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;white-space:nowrap;border:1.5px solid var(--text);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--card);color:var(--text)}
.sheet-head .plate{font-size:13.5px;margin:0 6px 0 0}
.row-actions{display:flex;align-items:center;gap:6px;padding:0 10px 0 4px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:19px;font-weight:800;line-height:1}
.ib.ok{color:var(--paid);border-color:var(--paid);background:var(--paid-soft)}
.ib.q{color:var(--unclear);border-color:var(--unclear);background:var(--unclear-soft)}
.ib.no{color:var(--unpaid);border-color:var(--unpaid);background:var(--unpaid-soft)}
.ib.back{color:var(--muted)}
.prog{display:block;margin-top:4px}
.prog-bar{display:block;max-width:240px;height:7px;margin-top:4px;border-radius:99px;background:var(--soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog-bar i{display:block;height:100%;background:var(--paid)}
.prog.partial .prog-bar i{background:var(--partial)} .prog.unclear .prog-bar i{background:var(--unclear)}
.prog-txt{display:flex;flex-wrap:wrap;gap:0 10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.prog-txt span{white-space:nowrap}
.prog.unpaid .prog-txt{color:var(--muted)}
.prog.partial .prog-txt{color:var(--partial);font-weight:600}
.ib.wa{color:#17914e;text-decoration:none}
.ib.wa.bad{color:var(--muted);border-style:dashed}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.wa{color:#17914e;border-color:#17914e}
@media (prefers-color-scheme: dark){.ib.wa,.btn.wa{color:#4ade80}.btn.wa{border-color:#4ade80}}
.dup{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:12px 0}
.dup-why{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.dup-why .badge{margin-left:0;font-size:12.5px;padding:2px 8px}
.dup-c{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:8px 8px 8px 10px;margin-bottom:6px}
.dup-c.on{border-color:var(--accent);background:var(--accent-soft)}
.dup-c label{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.dup-c input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.dup-i{display:block;min-width:0;overflow-wrap:anywhere}
.badge.keep{background:var(--accent);color:var(--on-accent)}
.dup .actions{margin-top:10px}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.welcome{padding:22px 18px;text-align:center}
.welcome p{color:var(--muted);margin:6px 0 14px}
.welcome .btn{margin:4px}

@media (min-width:900px){
  .lists{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .switch{display:none}
  .top h1{font-size:19px}
}
@media (min-width:1250px){
  .lists{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:899px){
  .lists:not(.searching) .col:not(.active){display:none}
}
@media (max-width:430px){
  .top h1{font-size:15.5px;gap:7px}
  .top-in{gap:6px}
  .pill{font-size:12px;padding:6px 9px}
  .pill.ok,.pill.local,.pill.pending,.pill.busy{padding:9px}
  .pill.ok .txt,.pill.local .txt,.pill.pending .txt,.pill.busy .txt{display:none}
  .lang button{padding:0 8px}
}
@media (max-width:350px){
  .top .logo{display:none}
  .top h1{font-size:14px}
}

/* dialogs */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@supports (max-height:92dvh){.sheet{max-height:92dvh}}
@media (min-width:640px){.ov{align-items:center;padding:20px}.sheet{border-radius:18px;padding:20px}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h2{font-size:19px;flex:1;overflow-wrap:anywhere}
.sheet-head .sub{color:var(--muted);font-size:14px;font-weight:400;display:block;margin-top:2px}
.field{margin-bottom:12px}
.field label,.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.field .hint,.hint{font-size:13px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:560px){.seg{grid-template-columns:repeat(2,1fr)}}
.seg label{display:block;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:11px;padding:10px 4px;font-size:14px;font-weight:650;min-height:44px}
.seg input:checked+span.paid{background:var(--paid-soft);border-color:var(--paid);color:var(--paid)}
.seg input:checked+span.unpaid{background:var(--unpaid-soft);border-color:var(--unpaid);color:var(--unpaid)}
.seg input:checked+span.unclear{background:var(--unclear-soft);border-color:var(--unclear);color:var(--unclear)}
.seg input:checked+span.partial{background:var(--partial-soft);border-color:var(--partial);color:var(--partial)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;margin-bottom:12px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions .grow{flex:1}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12.5px;border-radius:8px;padding:3px 8px;font-weight:600}
.chip.partial{background:var(--partial-soft);color:var(--partial)} button.chip.partial{border-color:var(--partial)}
.chip.paid{background:var(--paid-soft);color:var(--paid)} .chip.unpaid{background:var(--unpaid-soft);color:var(--unpaid)} .chip.unclear{background:var(--unclear-soft);color:var(--unclear)}
.sech{font-size:15.5px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sech.first{border-top:0;padding-top:0;margin-top:2px}
button.chip{border:1px solid transparent;min-height:36px;padding:5px 10px;font-size:13px}
button.chip.paid{border-color:var(--paid)} button.chip.unpaid{border-color:var(--unpaid)} button.chip.unclear{border-color:var(--unclear)}
.sheet.fixed{display:flex;flex-direction:column;overflow:hidden;padding:0}
.sheet.fixed form,.sheet.fixed .fs{display:flex;flex-direction:column;flex:1;min-height:0}
.fs-body>p{margin-bottom:10px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:var(--soft)}
.box p{font-size:14.5px;margin-bottom:8px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;margin:12px 0}
.files{list-style:none;margin:0 0 10px;padding:0}
.files li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:2px 2px 2px 12px;margin-bottom:6px;font-size:14.5px}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files small{color:var(--muted)}
.im-busy{text-align:center;padding:36px 8px}
.spin{display:inline-block;width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.tx{border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:12px;padding:10px 12px 0;margin-bottom:10px}
.tx.paid{border-left-color:var(--paid)} .tx.unclear{border-left-color:var(--unclear)} .tx.partial{border-left-color:var(--partial)}
.tx-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:2px}
.tx-top b{font-size:16.5px;font-variant-numeric:tabular-nums}
.tx-top span{color:var(--muted);font-size:14px}
.tx-top .tx-payer{color:var(--text);font-weight:600}
.tx-top .badge{margin-left:0;font-size:11.5px}
.tx-top .badge.warn{color:var(--unpaid)}
.tx-top .badge.new{background:var(--paid-soft);color:var(--paid)}
.tx-top .plate{margin-left:0}
.tx-sub{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.tx .two{margin-top:8px;grid-template-columns:1.5fr 1fr}
@media (max-width:560px){.tx .two{grid-template-columns:1fr;gap:0}}
.tx .check{margin-top:-2px}
.tx-sum{font-weight:650}
.newc{border-top:1px dashed var(--line);margin-top:2px;padding-top:10px}
.sheet.fixed .sheet-head{padding:16px 16px 0;margin-bottom:6px}
.fs-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 14px}
.fs-foot{margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
@media (min-width:640px){.sheet.fixed .sheet-head{padding:20px 20px 0}.fs-body{padding:6px 20px 16px}.fs-foot{padding:12px 20px 16px}}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sec h3{font-size:16px;margin-bottom:8px}
.sec p{font-size:14.5px;margin-bottom:10px}
.lotrow{display:flex;gap:8px;margin-bottom:8px}
details{font-size:14.5px;margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
details ol{padding-left:20px;margin:8px 0}
details li{margin-bottom:6px}
code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:13.5px;overflow-wrap:anywhere}

function t(key){
  const e = I18N[key], a = arguments;

const loc = () => ui.lang === 'en' ? 'en-GB' : 'es-AR';

const pad2 = n => String(n).padStart(2,'0');
function curMonth(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function addMonth(m, n){ let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo-1)/12); mo = ((mo-1)%12+12)%12+1; return y + '-' + pad2(mo); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtMonthLong = m => { const [y, mo] = m.split('-').map(Number); return cap(new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(new Date(y, mo-1, 1))); };
const fmtMonthShort = m => { const [y, mo] = m.split('-').map(Number); return cap(new Intl.DateTimeFormat(loc(),{month:'short'}).format(new Date(y, mo-1, 1)).replace('.','')) + ' ' + String(y).slice(2); };
const fmtDate = iso => { if(!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(new Date(y, m-1, d)).replace('.',''); };
const fmtTime = ts => new Date(ts).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit',hour12:false});
const numFmt0 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const numFmt2 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum = n => n ? (Number.isInteger(n) ? numFmt0 : numFmt2).format(n) : '';
const fmtMoney = n => '$ ' + (fmtNum(Math.round((n || 0) * 100) / 100) || '0');

/* Understands 45000 · 45.000 · 45.000,50 · 45,000.50 */
function parseAmount(v){
  let s = String(v ?? '').replace(/[^\d.,-]/g,'');
  if(!s) return 0;
  const dot = s.includes('.'), comma = s.includes(',');
  if(dot && comma){
    const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
    const th = dec === '.' ? ',' : '.';
    s = s.split(th).join('').replace(dec,'.');
  }else if(comma){
    s = (/,\d{1,2}$/.test(s) && s.split(',').length === 2) ? s.replace(',','.') : s.split(',').join('');
  }else if(dot){
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.split('.').join('');
  }
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n*100)/100 : 0;
}
const splitNames = s => String(s ?? '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean);

/* ---------- data model ----------
   lots:      { id: {id,name,order,deleted?,t} }
   customers: { id: {id,lot,name,spot,amount,aliases[],phone,note,from,until,deleted?,t} }
   payments:  { "customerId|YYYY-MM": {s:'paid'|'unpaid'|'unclear', a,d,p,n, t} }
   settings:  { ai: {key,model,t} } - the Anthropic API key, shared by all connected devices; nodup: {pairs[],t} - customer pairs that are not duplicates
   t = timestamp of the last change; when merging, the newer record wins.
   The three built-in lots keep their internal name until renamed (t = 0) and are shown translated. */
const NO_LOT = 'none';              /* the place "?" for customers that cannot be assigned to a parking lot yet */
function emptyState(){
  return { v:1,
    lots:{ lot1:{id:'lot1',name:'Parkanlage 1',order:1,t:0}, lot2:{id:'lot2',name:'Parkanlage 2',order:2,t:0}, lot3:{id:'lot3',name:'Parkanlage 3',order:3,t:0}, [NO_LOT]:{id:NO_LOT,name:'?',order:0,t:0} },
    customers:{}, payments:{}, settings:{} };
}
function normalize(s){
  const base = emptyState();
  const out = { v:1, lots:{}, customers:{}, payments:{}, settings:{} };
  if(s && typeof s === 'object'){
    for(const k of ['lots','customers','payments','settings']) if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) out[k] = s[k];
  }
  for(const id in base.lots) if(!out.lots[id]) out.lots[id] = base.lots[id];
  const q = out.lots[NO_LOT];          /* "?" always exists; a device with an older version may have renamed or removed it */
  if(q.deleted || q.name !== '?') out.lots[NO_LOT] = Object.assign({}, base.lots[NO_LOT], { t: (q.t || 0) + 1 });
  return out;
}
function canon(o){
  if(o === null || typeof o !== 'object') return JSON.stringify(o) ?? 'null';
  if(Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  return '{' + Object.keys(o).sort().filter(k => o[k] !== undefined).map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}';
}
function mergeMap(a, b){
  const out = {};
  for(const k of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])){
    const x = a && a[k], y = b && b[k];
    if(!x) out[k] = y;
    else if(!y) out[k] = x;
    else if((y.t || 0) > (x.t || 0)) out[k] = y;
    else if((x.t || 0) > (y.t || 0)) out[k] = x;
    else out[k] = canon(x) >= canon(y) ? x : y;
  }
  return out;
}
function mergeState(a, b){
  return { v:1, lots:mergeMap(a.lots, b.lots), customers:mergeMap(a.customers, b.customers), payments:mergeMap(a.payments, b.payments), settings:mergeMap(a.settings, b.settings) };
}

let state = normalize(store.get(LS.data, null));
let cfg = store.get(LS.cfg, null);
ui.month = curMonth();
let rev = 0;
const sync = { status: cfg ? 'pending' : 'local', msg:'', last:0, busy:false, again:false, timer:null };

function saveLocal(){ if(!store.set(LS.data, state)) toast(t('storageFail')); }
function saveUi(){ store.set(LS.ui, { lot:ui.lot, list:ui.list, sort:ui.sort, lang:ui.lang }); }
function commit(){
  rev++;
  saveLocal(); store.set(LS.dirty, true);
  render();
  if(cfg){ setSync('pending'); clearTimeout(sync.timer); sync.timer = setTimeout(runSync, 1500); }
}

/* ---------- queries ---------- */
const lotLabel = l => l.id === NO_LOT ? t('lotNone') : (!l.t && /^Parkanlage \d+$/.test(l.name)) ? t('lotN', l.order) : l.name;
const hasNoLot = () => Object.values(state.customers).some(c => !c.deleted && c.lot === NO_LOT);
const lotsList = () => Object.values(state.lots).filter(l => !l.deleted && l.id !== NO_LOT).sort((a,b) => (a.order||0) - (b.order||0) || a.name.localeCompare(b.name));
const lotName = id => (state.lots[id] && !state.lots[id].deleted) ? lotLabel(state.lots[id]) : '';
function customersFor(lot, month){
  return Object.values(state.customers).filter(c =>
    !c.deleted && state.lots[c.lot] && !state.lots[c.lot].deleted &&
    (lot === 'all' || c.lot === lot) &&
    (!c.from || c.from <= month) && (!c.until || month <= c.until));
}
const payKey = (cid, m) => cid + '|' + m;
const payOf = (cid, m) => state.payments[payKey(cid, m)] || null;
const statusOf = (cid, m) => { const p = payOf(cid, m); return (p && ORDER.includes(p.s)) ? p.s : 'unpaid'; };
/* how much of the month has been paid so far */
function paidAmount(c, s, p){
  if(s === 'unpaid') return 0;
  if(s === 'paid') return (p && p.a) || c.amount || 0;
  return (p && p.a) || 0;
}
function priorOpen(c, month){
  let n = 0;
  for(let i = 1; i <= 12; i++){
    const m = addMonth(month, -i);
    if(c.from && m < c.from) break;
    if(statusOf(c.id, m) !== 'paid') n++;
  }
  return n;
}
function setPayment(cid, month, rec){                 /* leaves the record untouched when nothing changed */
  const clean = { s: rec.s };
  if(rec.a) clean.a = rec.a;
  if(rec.d) clean.d = rec.d;
  if(rec.p) clean.p = rec.p;
  if(rec.n) clean.n = rec.n;
  if(rec.x && rec.x.length) clean.x = rec.x;      /* transfers already imported from a statement */
  const key = payKey(cid, month), old = state.payments[key];
  if(old && old.r && clean.s !== 'paid') clean.r = old.r;        /* the reminder date stays until it is paid */
  const bare = o => canon(Object.assign({}, o, { t: undefined }));
  if(old ? bare(old) === bare(clean) : (clean.s === 'unpaid' && Object.keys(clean).length === 1)) return false;
  clean.t = Date.now();
  state.payments[key] = clean;
  return true;
}
/* ---------- WhatsApp reminder ----------
   Opens the chat of the customer's number with a prepared Spanish text (wa.me link). */
const WA_DEFAULT = 'Hola {nombre}, ¿cómo estás? Te escribimos del estacionamiento para recordarte que está pendiente el pago mensual de {monto} correspondiente a {meses}. Si ya lo hiciste, por favor envianos el comprobante. ¡Muchas gracias!';
const WA_DEFAULT_PARTIAL = 'Hola {nombre}, ¿cómo estás? Te escribimos del estacionamiento: del pago mensual de {monto} correspondiente a {mes} recibimos {pagado} y falta abonar {falta}. Si ya lo hiciste, por favor envianos el comprobante. ¡Muchas gracias!';
const WA_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.5-4.3A8.5 8.5 0 1 1 20.5 11.6z"/><path d="M9.2 8.6c-.3 2.6 3.2 6 5.9 5.9"/></svg>';
const waSettings = () => { const w = (state.settings && state.settings.wa) || {}; return { text: w.text || '', area: w.area || '' }; };
/* Turns a number as people write it in Argentina into what WhatsApp expects: 54 9 + area code + number, without 0 and 15.
   Returns '' when it cannot be completed (no area code). Numbers of other countries need a leading +. */
function waNumber(phone, area){
  const raw = String(phone ?? '').trim();
  let d = raw.replace(/\D/g,'');
  if(!d) return '';
  const intl = raw.startsWith('+') || d.startsWith('00');
  if(d.startsWith('00')) d = d.slice(2);
  if(intl && !d.startsWith('54')) return d.length >= 8 ? d : '';
  if(d.startsWith('54') && (intl || d.length >= 12)) d = d.slice(2);
  if(d.startsWith('9') && d.length === 11) d = d.slice(1);
  d = d.replace(/^0+/, '');
  if(d.length === 12) for(const a of [2, 3, 4]) if(d.substr(a, 2) === '15'){ d = d.slice(0, a) + d.slice(a + 2); break; }
  if(d.length === 10 && d.startsWith('15')) d = d.slice(2);
  if(d.length < 10){
    if(d.startsWith('15') && d.length >= 8) d = d.slice(2);
    const ac = String(area ?? '').replace(/\D/g,'').replace(/^0+/, '');
    if(!ac || ac.length + d.length !== 10) return '';
    d = ac + d;
  }
  return d.length === 10 ? '549' + d : '';
}
/* the months a customer still owes, up to the month shown */
function openMonths(c, month){
  const out = [];
  for(let i = 12; i >= 0; i--){
    const m = addMonth(month, -i);
    if(c.from && m < c.from) continue;
    if(statusOf(c.id, m) !== 'paid') out.push(m);
  }
  return out;
}
function monthsInSpanish(list){
  const name = m => { const [y, mo] = m.split('-').map(Number); return new Intl.DateTimeFormat('es-AR', { month:'long' }).format(new Date(y, mo - 1, 1)); };
  const join = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1] : a[0] || '';
  const years = new Set(list.map(m => m.slice(0, 4)));
  return years.size === 1 ? join(list.map(name)) + ' de ' + list[0].slice(0, 4) : join(list.map(m => name(m) + ' de ' + m.slice(0, 4)));
}
function waText(c, month, template){
  const st = c.id ? statusOf(c.id, month) : 'unpaid', got = c.id ? paidAmount(c, st, payOf(c.id, month)) : 0;
  let text = template || waSettings().text || (st === 'partial' && c.amount ? WA_DEFAULT_PARTIAL : WA_DEFAULT);
  const owed = c.id ? openMonths(c, month) : [];
  if(!c.amount) text = text.replace(/\s+(?:de|por)\s+\{monto\}/gi, '');
  const map = { nombre: c.name, monto: c.amount ? fmtMoney(c.amount) : '', pagado: fmtMoney(got), falta: fmtMoney(Math.max(0, (c.amount || 0) - got)), mes: monthsInSpanish([month]), meses: monthsInSpanish(owed.length ? owed : [month]),
    lugar: c.spot || '', patente: c.plate || '', estacionamiento: c.lot === NO_LOT ? '' : lotName(c.lot) };
  return text.replace(/\{(\w+)\}/g, (m, k) => k in map ? map[k] : m).replace(/[ \t]{2,}/g, ' ').trim();
}
const waUrl = (number, text) => 'https://wa.me/' + number + (text ? '?text=' + encodeURIComponent(text) : '');
/* remembers the day of the last reminder, so the other person sees it too */
function markReminded(cid, month){
  const key = payKey(cid, month), old = state.payments[key] || { s:'unpaid' };
  if(old.s === 'paid' || old.r === todayISO()) return;
  state.payments[key] = Object.assign({}, old, { r: todayISO(), t: Date.now() });
  commit();
}

function quickStatus(cid, s){
  const c = state.customers[cid]; if(!c) return;
  const month = ui.month, key = payKey(cid, month);
  const old = state.payments[key] ? Object.assign({}, state.payments[key]) : null;
  const o = old || {};
  if(s === 'paid') setPayment(cid, month, { s, a: c.amount ? Math.max(c.amount, o.a || 0) : o.a, d: o.d || todayISO(), p: o.p, n: o.n, x: o.x });      /* paid = the full amount */
  else if(s === 'unclear') setPayment(cid, month, { s, a: o.a, d: o.d, p: o.p, n: o.n, x: o.x });
  else setPayment(cid, month, { s:'unpaid', n: o.n });
  commit();
  toast(c.name + ' → ' + t(s), t('undo'), () => {
    if(old){ old.t = Date.now(); state.payments[key] = old; }
    else state.payments[key] = { s:'unpaid', t: Date.now() };
    commit();
  });
}

function renderTabs(){

    return `<button type="button" class="tab${ui.lot === id ? ' on' : ''}" data-lot="${esc(id)}" aria-pressed="${ui.lot === id}"><b>${esc(name)}</b><small>${esc(t('tabCount', paid, cs.length))}</small></button>`;
  };
  $('#tabs').innerHTML = lots.map(l => cell(l.id, lotLabel(l))).join('') + (lots.length > 1 ? cell('all', t('all')) : '');
  $('#btnDup').hidden = !(ui.lot === 'all' || lots.length < 2);        /* the check covers all parking lots, so it lives under "All" */
}

function renderMonth(){
  $('#monthLabel').textContent = fmtMonthLong(ui.month);
  $('#monthSub').innerHTML = ui.month === curMonth()
    ? `<span class="tag-now">${esc(t('curMonth'))}</span>`
    : `<button type="button" class="link" id="toNow">${esc(t('toNow'))}</button>`;
}

const plates = c => splitNames(c.plate);
const cleanPlate = v => splitNames(String(v ?? '').toUpperCase()).map(x => x.replace(/\s+/g,' ')).join(', ');
const plateKey = v => norm(v).replace(/[^a-z0-9]/g,'');
const platesHtml = c => plates(c).map(x => `<span class="plate">${esc(x)}</span>`).join('');
function searchText(c, p){
  return norm([c.name, c.plate, (c.aliases || []).join(' '), c.spot, c.phone, c.note, p && p.p, p && p.n, lotName(c.lot)].filter(Boolean).join(' '));
}
function sortCustomers(list){
  const coll = new Intl.Collator(ui.lang, { numeric:true, sensitivity:'base' });
  if(ui.sort === 'plate') return list.sort((a, b) => coll.compare(plateKey(a.plate) || '\uffff', plateKey(b.plate) || '\uffff') || coll.compare(a.name, b.name));
  return list.sort((a, b) => ui.sort === 'spot'
    ? (coll.compare(a.spot || '\uffff', b.spot || '\uffff') || coll.compare(a.name, b.name))
    : (coll.compare(a.name, b.name) || coll.compare(a.spot || '', b.spot || '')));
}

function progressHtml(c, s, p){
  const fee = c.amount || 0, got = paidAmount(c, s, p);
  if(!fee && !got) return '';
  const pct = fee ? Math.max(0, Math.min(100, got / fee * 100)) : 100;
  const parts = [fee ? t('progOf', fmtMoney(got), fmtMoney(fee)) : fmtMoney(got)];
  if(fee && s === 'partial' && got < fee) parts.push(t('progLeft', fmtMoney(fee - got)));
  return `<span class="prog ${s}"><span class="prog-txt">${parts.map(x => `<span>${esc(x)}</span>`).join(' ')}</span><span class="prog-bar"><i style="width:${pct}%"></i></span></span>`;
}
function rowHtml(c, s, p){
  const bits = [];
  if(c.spot) bits.push(esc(t('space', c.spot)));
  if(s === 'paid' || s === 'partial'){
    if(p && p.d) bits.push(esc(t('onDate', fmtDate(p.d))));
    if(p && p.p) bits.push(esc(t('fromPayer', p.p)));
  }else if(p && p.p) bits.push(esc(t('maybeFrom', p.p)));
  if(s !== 'paid' && p && p.r) bits.push(esc(t('reminded', fmtDate(p.r))));
  const alias = (c.aliases && c.aliases.length && !(s === 'paid' && p && p.p)) ? `<span class="row-sub">${esc(t('paysVia', c.aliases.join(', ')))}</span>` : '';
  const note = (p && p.n) ? `<span class="row-note">📝 ${esc(p.n)}</span>` : '';
  const open = s !== 'paid' ? priorOpen(c, ui.month) : 0;
  const badges = (ui.lot === 'all' ? `<span class="badge${c.lot === NO_LOT ? ' warn' : ''}">${esc(lotName(c.lot))}</span>` : '') +
    (open ? `<span class="badge warn">${esc(open === 1 ? t('open1') : t('openN', open))}</span>` : '');
  const btn = (act, cls, sym, label) => `<button type="button" class="ib ${cls}" data-act="${act}" aria-label="${esc(label)}" title="${esc(label)}">${sym}</button>`;
  let wa = '';
  if(s !== 'paid' && c.phone){
    const num = waNumber(c.phone, waSettings().area);
    wa = num ? `<a class="ib wa" data-act="wa" href="${esc(waUrl(num, waText(c, ui.month)))}" target="_blank" rel="noopener" aria-label="${esc(t('waBtn'))}" title="${esc(t('waBtn'))}">${WA_ICON}</a>`
             : `<button type="button" class="ib wa bad" data-act="wa-bad" aria-label="${esc(t('waBtn'))}" title="${esc(t('waBtn'))}">${WA_ICON}</button>`;
  }
  let acts = '';
  if(s === 'unpaid') acts = btn('paid','ok','✓',t('actPaid')) + btn('unclear','q','?',t('actUnclear'));
  else if(s === 'unclear' || s === 'partial') acts = btn('paid','ok','✓',t('actPaid')) + btn('unpaid','no','✕',t('actUnpaid'));
  else acts = btn('unpaid','back','↩',t('actBack'));
  return `<li class="row" data-id="${esc(c.id)}">
    <button type="button" class="row-main" data-act="open" title="${esc(t('editCustomer'))}">
      <span class="row-name">${esc(c.name)}${platesHtml(c)}${badges}</span>
      ${bits.length ? `<span class="row-sub">${bits.join(' · ')}</span>` : ''}${progressHtml(c, s, p)}${alias}${note}
    </button>
    <div class="row-actions">${wa}${acts}</div></li>`;
}

function renderLists(){
  const month = ui.month, q = norm($('#search').value), qPlate = plateKey(q);
  const all = customersFor(ui.lot, month);
  const groups = { paid:[], partial:[], unpaid:[], unclear:[] }, totals = { paid:0, partial:0, unpaid:0, unclear:0 }, counts = { paid:0, partial:0, unpaid:0, unclear:0 };
  let expected = 0, received = 0;
  for(const c of all){
    const p = payOf(c.id, month), s = statusOf(c.id, month);
    const got = paidAmount(c, s, p), amt = s === 'paid' || s === 'partial' ? got : (c.amount || 0);
    counts[s]++; totals[s] += amt; expected += c.amount || 0; if(s === 'paid' || s === 'partial') received += got;
    if(!q || searchText(c, p).includes(q) || (qPlate.length > 1 && plateKey(c.plate).includes(qPlate))) groups[s].push(c);
  }
  const n = all.length;

  /* summary */
  const pct = k => n ? (counts[k] / n * 100) : 0;
  $('#summary').innerHTML = n ? `
    <div class="sum-head">
      <span class="big">${esc(t('sumPaid', counts.paid, n) + (counts.partial ? ' · ' + t('sumPartial', counts.partial) : ''))}</span>
      <span class="money">${esc(t('sumMoney', fmtMoney(received), fmtMoney(expected)))}</span>
    </div>
    <div class="bar" aria-hidden="true"><i class="p" style="width:${pct('paid')}%"></i><i class="h" style="width:${pct('partial')}%"></i><i class="c" style="width:${pct('unclear')}%"></i><i class="u" style="width:${pct('unpaid')}%"></i></div>`
    : `<div class="sum-head"><span class="big">${esc(t('sumNone', fmtMonthLong(month)))}</span></div>`;

  /* banner */
  let banner = '';
  if(!cfg && !isLocked()) banner = `<div class="banner"><span>${esc(t('bannerLocal'))}</span><button type="button" class="btn small" data-open="sync">${esc(t('bannerSetup'))}</button></div>`;
  else if(sync.status === 'error') banner = `<div class="banner err"><span>${esc(sync.msg || t('bannerErr'))}</span><button type="button" class="btn small" data-open="sync">${esc(t('settings'))}</button></div>`;
  if(IS_IOS && !STANDALONE && !store.get(LS.a2hs, false)) banner += `<div class="banner info"><span>${esc(t('a2hs'))}</span><button type="button" class="icon-btn" data-dismiss="a2hs" aria-label="${esc(t('aClose'))}" title="${esc(t('aClose'))}">✕</button></div>`;
  $('#banner').innerHTML = banner;

  /* list switch (phone) */
  $('#switch').innerHTML = ORDER.map(k => `<button type="button" class="${k}${ui.list === k ? ' on' : ''}" data-list="${k}"><b>${counts[k]}</b>${esc(t(k))}</button>`).join('');

  /* lists */
  const lists = $('#lists');
  lists.classList.toggle('searching', !!q);
  const totalCustomers = Object.values(state.customers).filter(c => !c.deleted).length;
  if(!totalCustomers){
    if(isLocked()){ lists.innerHTML = ''; return; }
    lists.innerHTML = `<div class="card welcome" style="grid-column:1/-1">
      <h2>${esc(t('welcome'))}</h2>
      <p>${esc(t('welcomeText'))}</p>
      <button type="button" class="btn primary" data-open="add">${esc(t('welcomeAdd'))}</button>
      <button type="button" class="btn" data-open="bulk">${esc(t('bulkTitle'))}</button>
    </div>`;
    return;
  }
  const emptyKey = { paid:'emptyPaid', partial:'emptyPartial', unpaid:'emptyUnpaid', unclear:'emptyUnclear' };
  lists.innerHTML = ORDER.map(k => {
    const rows = sortCustomers(groups[k]).map(c => rowHtml(c, k, payOf(c.id, month))).join('');
    return `<section class="card col ${k}${ui.list === k ? ' active' : ''}">
      <div class="col-head"><span class="mark"></span><span>${esc(t(k))}</span><span class="sum">${counts[k] ? esc(fmtMoney(totals[k])) : ''}</span><span class="cnt">${q ? groups[k].length + ' / ' : ''}${counts[k]}</span></div>
      ${rows ? '<ul>' + rows + '</ul>' : `<div class="empty">${esc(q ? t('noMatch') : t(emptyKey[k]))}</div>`}
    </section>`;
  }).join('');
}

const SYNC_KEY = { local:'sLocal', ok:'sOk', busy:'sBusy', pending:'sPending', offline:'sOffline', error:'sError' };
function renderSync(){
  const el = $('#syncPill'), label = t(SYNC_KEY[sync.status]);
  el.className = 'pill ' + sync.status;
  const ghosts = ['ok','pending','busy'].map(k => `<span class="ghost" aria-hidden="true">${esc(t(SYNC_KEY[k]))}</span>`).join('');     /* reserve the widest of the three */
  el.innerHTML = `<span class="dot"></span><span class="txt"><span>${esc(label)}</span>${ghosts}</span>`;
  el.setAttribute('aria-label', label);
  el.title = sync.status === 'ok' && sync.last ? t('lastSync', fmtTime(sync.last)) : (sync.msg || label);
}
function setSync(status, msg){
  const was = sync.status;
  sync.status = status; sync.msg = msg || '';
  renderSync();
  if((was === 'error') !== (status === 'error')) renderLists();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(text, actionLabel, action){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(text)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
  el.classList.add('show');
  if(actionLabel) $('button', el).onclick = () => { el.classList.remove('show'); action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 6000 : 3500);
}

/* ---------- dialogs ---------- */
const modals = [];
function openModal(html, cls){
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  modals.push(ov);
  document.body.classList.add('noscroll');
  $('#toast').classList.remove('show');
  ov.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeModal(ov); });
  return ov.firstElementChild;
}
function closeModal(ov){
  ov = ov && ov.classList && ov.classList.contains('ov') ? ov : (ov ? ov.closest('.ov') : modals[modals.length-1]);
  if(!ov) return;
  const i = modals.indexOf(ov); if(i >= 0) modals.splice(i, 1);
  ov.remove();
  if(!modals.length) document.body.classList.remove('noscroll');
}
const closeX = () => `<button type="button" class="icon-btn" data-close aria-label="${esc(t('aClose'))}" title="${esc(t('aClose'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
function confirmBox(title, text, okLabel, danger){
  return new Promise(resolve => {
    const el = openModal(`<div class="sheet-head"><h2>${esc(title)}</h2></div><p>${esc(text)}</p>
      <div class="actions"><button type="button" class="btn grow" data-no>${esc(t('cancel'))}</button><button type="button" class="btn grow ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button></div>`);
    $('[data-no]', el).onclick = () => { closeModal(el); resolve(false); };
    $('[data-yes]', el).onclick = () => { closeModal(el); resolve(true); };
  });
}
function monthOptions(selected, withNone){
  const now = curMonth(); let html = withNone ? `<option value="">${esc(t('ongoing'))}</option>` : '';
  const set = new Set(); for(let i = -36; i <= 12; i++) set.add(addMonth(now, i)); if(selected) set.add(selected);
  for(const m of Array.from(set).sort()) html += `<option value="${m}"${m === selected ? ' selected' : ''}>${esc(fmtMonthLong(m))}</option>`;
  return html;
}
const lotOptions = sel => lotsList().concat(state.lots[NO_LOT]).map(l => `<option value="${esc(l.id)}"${l.id === sel ? ' selected' : ''}>${esc(lotLabel(l))}</option>`).join('');

/* one sheet for everything about a customer: this month's payment, earlier months, customer details */
function openCustomer(cid){
  const c = cid ? state.customers[cid] : null;
  const month = ui.month;
  const lot = c ? c.lot : (ui.lot !== 'all' ? ui.lot : (lotsList()[0] || {}).id);
  const p = c ? (payOf(cid, month) || {}) : {}, s = c ? statusOf(cid, month) : 'unpaid';
  const hist = {};                       /* earlier month -> status as shown; changed ones are saved */
  const mark = { paid:'✓', partial:'½', unpaid:'✕', unclear:'?' };
  let histHtml = '';
  if(c) for(let i = 12; i >= 1; i--){
    const m = addMonth(month, -i); if(c.from && m < c.from) continue;
    hist[m] = statusOf(cid, m);
    histHtml += `<button type="button" class="chip ${hist[m]}" data-m="${m}">${esc(fmtMonthShort(m))} <b>${mark[hist[m]]}</b></button>`;
  }
  const paySection = !c ? '' : `
      <h3 class="sech first">${esc(t('payFor', fmtMonthLong(month)))}</h3>
      <div class="field"><span class="lbl">${esc(t('status'))}</span>
        <div class="seg">${ORDER.map(k => `<label><input type="radio" name="s" value="${k}"${k === s ? ' checked' : ''}><span class="${k}">${esc(t(k))}</span></label>`).join('')}</div>
      </div>
      <div class="two">
        <div class="field"><label for="pa">${esc(t('amount'))}</label><input id="pa" type="text" inputmode="decimal" autocomplete="off" value="${esc(fmtNum(p.a || (s === 'paid' ? c.amount : 0)))}" placeholder="${esc(fmtNum(c.amount))}"></div>
        <div class="field"><label for="pd">${esc(t('receivedOn'))}</label><input id="pd" type="date" value="${esc(p.d || '')}"></div>
      </div>
      <div class="hint" id="payProg" style="margin:-6px 0 12px"></div>
      <div class="field"><label for="pp">${esc(t('payer'))}</label>
        <input id="pp" type="text" list="payerNames" autocomplete="off" value="${esc(p.p || '')}" placeholder="${esc(t('payerPh'))}">
        <datalist id="payerNames">${[c.name].concat(c.aliases || []).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      </div>
      <label class="check" id="rememberRow" hidden><input type="checkbox" id="remember" checked><span id="rememberText"></span></label>
      <div class="field"><label for="pn">${esc(t('monthNote'))}</label><textarea id="pn" placeholder="${esc(t('monthNotePh'))}">${esc(p.n || '')}</textarea></div>
      ${histHtml ? `<h3 class="sech">${esc(t('otherMonths'))}</h3><div class="hist" id="hist">${histHtml}</div><p class="hint">${esc(t('tapMonth'))}</p>` : ''}
      <h3 class="sech">${esc(t('custData'))}</h3>`;
  const el = openModal(`
    <form novalidate>
    <div class="sheet-head"><h2>${c ? esc(c.name) + `<span class="sub">${plates(c).map(x => `<span class="plate">${esc(x)}</span>`).join('')}${esc([lotName(c.lot), c.spot && t('space', c.spot)].filter(Boolean).join(' · '))}</span>` : esc(t('newCustomer'))}</h2>${closeX()}</div>
    <div class="fs-body">${paySection}
      <div class="field"><label for="cn">${esc(t('name'))}</label><input id="cn" type="text" autocomplete="off" value="${esc(c ? c.name : '')}" required></div>
      <div class="two">
        <div class="field"><label for="ck">${esc(t('plate'))}</label><input id="ck" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase" value="${esc(c ? c.plate || '' : '')}" placeholder="${esc(t('platePh'))}"></div>
        <div class="field"><label for="cs">${esc(t('spaceLbl'))}</label><input id="cs" type="text" autocomplete="off" value="${esc(c ? c.spot || '' : '')}"></div>
      </div>
      <div class="hint" style="margin:-6px 0 12px">${esc(t('plateHint'))}</div>
      <div class="two">
        <div class="field"><label for="cl">${esc(t('lot'))}</label><select id="cl">${lotOptions(lot)}</select></div>
        <div class="field"><label for="ca">${esc(t('monthly'))}</label><input id="ca" type="text" inputmode="decimal" value="${esc(c ? fmtNum(c.amount) : '')}"></div>
      </div>
      <div class="field"><label for="cz">${esc(t('aliases'))}</label>
        <input id="cz" type="text" autocomplete="off" value="${esc(c ? (c.aliases || []).join(', ') : '')}" placeholder="${esc(t('aliasesPh'))}">
        <div class="hint">${esc(t('aliasesHint'))}</div></div>
      <div class="field"><label for="cp">${esc(t('phone'))}</label><input id="cp" type="tel" autocomplete="off" value="${esc(c ? c.phone || '' : '')}"><div class="hint">${esc(t('phoneHint'))}</div></div>
      ${c ? `<p style="margin:-2px 0 12px"><a class="btn small wa" id="waGo" href="#" target="_blank" rel="noopener">${WA_ICON}<span>${esc(t(s !== 'paid' ? 'waBtn' : 'waOpen'))}</span></a></p><div id="waMsg"></div>` : ''}
      <div class="field"><label for="co">${esc(t('note'))}</label><textarea id="co">${esc(c ? c.note || '' : '')}</textarea></div>
      <div class="two">
        <div class="field"><label for="cf">${esc(t('paysFrom'))}</label><select id="cf">${monthOptions(c ? c.from : month, false)}</select></div>
        <div class="field"><label for="cu">${esc(t('lastMonth'))}</label><select id="cu">${monthOptions(c ? c.until || '' : '', true)}</select></div>
      </div>
      <div id="cErr"></div>
    </div>
    <div class="actions fs-foot">${c ? `<button type="button" class="btn danger" id="delCust">${esc(t('del'))}</button>` : ''}<button type="submit" class="btn primary grow">${esc(t('save'))}</button></div>
    </form>`, 'fixed');
  const f = id => $('#' + id, el);
  if(!c) setTimeout(() => f('cn').focus(), 50);
  if(c) f('waGo').addEventListener('click', e => {
    const num = waNumber(f('cp').value, waSettings().area), owes = statusOf(cid, month) !== 'paid';
    if(!num){ e.preventDefault(); f('waMsg').innerHTML = `<div class="msg err">${esc(f('cp').value.trim() ? t('waBad', c.name) : t('waNoPhone'))}</div>`; return; }
    f('waMsg').innerHTML = '';
    e.currentTarget.href = waUrl(num, owes ? waText(c, month) : '');
    if(owes) setTimeout(() => markReminded(cid, month), 400);
  });

  const knownNames = () => [f('cn').value.trim()].concat(splitNames(f('cz').value));
  const refreshRemember = () => {
    const v = f('pp').value.trim();
    const known = !v || knownNames().some(n => norm(n) === norm(v));
    f('rememberRow').hidden = known;
    if(!known) f('rememberText').textContent = t('remember', v, f('cn').value.trim() || c.name);
  };
  if(c){
    /* amount and status follow each other: less than the monthly amount = partial, the full amount = paid */
    const fee = () => parseAmount(f('ca').value);
    const stNow = () => ($('input[name=s]:checked', el) || {}).value || 'unpaid';
    const setSt = v => { const r = $('input[name=s][value=' + v + ']', el); if(r) r.checked = true; };
    const showProg = () => {
      const a = stNow() === 'unpaid' ? 0 : parseAmount(f('pa').value) || (stNow() === 'paid' ? fee() : 0), need = fee();
      f('payProg').textContent = need ? t('progOf', fmtMoney(a), fmtMoney(need)) + (a < need ? ' · ' + t('progLeft', fmtMoney(need - a)) : '') : '';
    };
    f('pa').addEventListener('input', () => {
      const a = parseAmount(f('pa').value), need = fee(), st = stNow();
      if(need && a > 0 && a < need && (st === 'paid' || st === 'unpaid')) setSt('partial');
      else if(need && a >= need && (st === 'partial' || st === 'unpaid')) setSt('paid');
      showProg();
    });
    $$('input[name=s]', el).forEach(r => r.addEventListener('change', () => {
      const a = parseAmount(f('pa').value), need = fee(), st = stNow();
      if(st === 'paid' && need && a < need) f('pa').value = fmtNum(need);
      if(st === 'partial' && (!a || (need && a >= need))){ f('pa').value = ''; f('pa').focus(); }
      if(st === 'unpaid') f('pa').value = '';
      showProg();
    }));
    f('ca').addEventListener('input', showProg);
    showProg();
    for(const id of ['pp','cn','cz']) f(id).addEventListener('input', refreshRemember);
    refreshRemember();
    const next = { unpaid:'paid', paid:'unclear', unclear:'unpaid', partial:'paid' };
    if(f('hist')) f('hist').addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if(!b) return;
      hist[b.dataset.m] = next[hist[b.dataset.m]];
      b.className = 'chip ' + hist[b.dataset.m];
      $('b', b).textContent = mark[hist[b.dataset.m]];
      b.setAttribute('aria-label', fmtMonthLong(b.dataset.m) + ': ' + t(hist[b.dataset.m]));
    });
    $$('#hist [data-m]', el).forEach(b => b.setAttribute('aria-label', fmtMonthLong(b.dataset.m) + ': ' + t(hist[b.dataset.m])));
  }

  $('form', el).onsubmit = e => {
    e.preventDefault();
    const fail = key => { f('cErr').innerHTML = `<div class="msg err">${esc(t(key))}</div>`; f('cErr').scrollIntoView({ block:'center' }); };
    const name = f('cn').value.trim(), from = f('cf').value, until = f('cu').value;
    if(!name) return fail('errName');
    if(until && until < from) return fail('errUntil');
    const id = c ? c.id : uid(), amount = parseAmount(f('ca').value);
    const aliases = splitNames(f('cz').value);
    if(c){
      let st = ($('input[name=s]:checked', el) || {}).value || 'unpaid';
      const pv = f('pp').value.trim();
      let a = parseAmount(f('pa').value), d = f('pd').value;
      if(st === 'partial' && !a) return fail('errPartial');
      if(st === 'partial' && amount && a >= amount) st = 'paid';
      if(st === 'paid'){ if(!a) a = amount; if(!d) d = todayISO(); }
      if(st === 'partial' && !d) d = todayISO();
      if(st === 'unpaid') a = 0;
      setPayment(id, month, { s: st, a, d, p: pv, n: f('pn').value.trim(), x: st === 'unpaid' ? null : p.x });
      if(pv && !f('rememberRow').hidden && f('remember').checked) aliases.push(pv);
      for(const m in hist){

/* ---------- duplicates ----------
   Looks through all customers of all parking lots for records that are probably the same customer:
   same plate, same or similar name, a name that is another customer's payer, same phone, same space.
   Pairs marked as "different customers" are kept in settings.nodup and not shown again. */
const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
const distinctPairs = () => { const d = state.settings && state.settings.nodup; return d && Array.isArray(d.pairs) ? d.pairs : []; };
const liveCustomer = id => { const c = state.customers[id]; return !!c && !c.deleted; };
const uniqBy = (list, key) => list.filter((x, i) => x && list.findIndex(y => y && key(y) === key(x)) === i);
function editDistance(a, b){
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function similarNames(a, b){            /* a, b: nameKey values */
  if(!a || !b || a === b || /\d/.test(a + b)) return false;
  const x = a.split(' '), y = b.split(' '), [s, l] = x.length <= y.length ? [x, y] : [y, x];
  if(s.length >= 2 && s.length < l.length && s.every(w => l.includes(w))) return true;        /* "Juan Perez" - "Juan Carlos Perez" */
  const min = Math.min(a.length, b.length), max = min >= 12 ? 2 : min >= 6 ? 1 : 0;
  return max > 0 && Math.abs(a.length - b.length) <= max && editDistance(a, b) <= max;        /* a typing mistake */
}
function phoneKey(p){
  const d = waNumber(p, waSettings().area) || String(p ?? '').replace(/\D/g, '');
  return d.length >= 8 ? d.slice(-8) : '';
}
function findDuplicates(){
  const list = Object.values(state.customers).filter(c => !c.deleted && state.lots[c.lot] && !state.lots[c.lot].deleted);
  const skip = new Set(distinctPairs());
  const info = list.map(c => ({ c, name: nameKey(c.name), plates: plates(c).map(plateKey).filter(k => k.length >= 4), alias: (c.aliases || []).map(nameKey).filter(Boolean),
    phone: phoneKey(c.phone), spot: c.spot ? c.lot + '|' + norm(c.spot) : '' }));
  const spotCount = {};
  for(const x of info) if(x.spot) spotCount[x.spot] = (spotCount[x.spot] || 0) + 1;
  const overlap = (a, b) => (!a.from || !b.until || a.from <= b.until) && (!b.from || !a.until || b.from <= a.until);
  const parent = info.map((_, i) => i), root = i => parent[i] === i ? i : (parent[i] = root(parent[i]));
  const found = [];
  for(let i = 0; i < info.length; i++) for(let j = i + 1; j < info.length; j++){
    const a = info[i], b = info[j], why = [];
    if(skip.has(pairKey(a.c.id, b.c.id))) continue;
    const pl = a.plates.find(k => b.plates.includes(k));
    if(pl) why.push(t('dupPlate', plates(a.c).find(x => plateKey(x) === pl)));
    if(a.name && a.name === b.name) why.push(t('dupName'));
    else if(similarNames(a.name, b.name)) why.push(t('dupSimilar'));
    if(a.name !== b.name){
      if(b.alias.includes(a.name)) why.push(t('dupAlias', a.c.name, b.c.name));
      else if(a.alias.includes(b.name)) why.push(t('dupAlias', b.c.name, a.c.name));
    }
    if(a.phone && a.phone === b.phone) why.push(t('dupPhone'));
    if(a.spot && a.spot === b.spot && spotCount[a.spot] <= 3 && overlap(a.c, b.c)) why.push(t('dupSpot', a.c.spot));      /* a "space" shared by many is a category, not a space */
    if(why.length){ found.push([i, why]); parent[root(i)] = root(j); }
  }
  const pays = {};
  for(const k in state.payments) if(ORDER.includes(state.payments[k].s) && state.payments[k].s !== 'unpaid'){ const id = k.slice(0, k.lastIndexOf('|')); pays[id] = (pays[id] || 0) + 1; }
  const score = c => (pays[c.id] || 0) * 10 + (c.plate ? 2 : 0) + (c.phone ? 1 : 0) + (c.amount ? 1 : 0) + (c.spot ? 1 : 0);
  const byRoot = {};
  for(const [i, why] of found){ const g = byRoot[root(i)] = byRoot[root(i)] || { reasons:[], members:[] }; for(const w of why) if(!g.reasons.includes(w)) g.reasons.push(w); }
  info.forEach((x, i) => { const g = byRoot[root(i)]; if(g) g.members.push({ c: x.c, pays: pays[x.c.id] || 0 }); });
  const coll = new Intl.Collator(ui.lang, { numeric:true, sensitivity:'base' });
  const groups = Object.values(byRoot);
  for(const g of groups){ g.members.sort((a, b) => score(b.c) - score(a.c) || coll.compare(a.c.name, b.c.name)); g.ids = g.members.map(m => m.c.id); }      /* the fullest record first: suggested to keep */
  groups.sort((a, b) => coll.compare(a.members[0].c.name, b.members[0].c.name));
  return { groups, total: list.length };
}
/* One month recorded on both customers: the better status wins; two different instalments add up. */
function joinPayments(a, b, fee){
  const rank = { unpaid:0, unclear:1, partial:2, paid:3 };
  const A = a || { s:'unpaid' }, sa = ORDER.includes(A.s) ? A.s : 'unpaid', sb = ORDER.includes(b.s) ? b.s : 'unpaid';
  const [hi, lo] = rank[sb] > rank[sa] ? [b, A] : [A, b];
  let s = rank[sb] > rank[sa] ? sb : sa, amt = hi.a || 0;
  const xa = A.x || [], xb = b.x || [];
  if(sa === 'partial' && sb === 'partial'){
    const same = xa.some(f => xb.includes(f)) || ((A.a || 0) === (b.a || 0) && (A.d || '') === (b.d || ''));      /* the same payment entered twice */
    amt = same ? Math.max(A.a || 0, b.a || 0) : Math.round(((A.a || 0) + (b.a || 0)) * 100) / 100;
    if(fee && amt >= fee - 0.5) s = 'paid';
  }else if(sa === sb) amt = Math.max(A.a || 0, b.a || 0);
  const rec = { s };
  if(s !== 'unpaid'){
    if(amt) rec.a = amt;
    const d = [hi.d, sa === sb ? lo.d : ''].filter(Boolean).sort().pop(); if(d) rec.d = d;
    const p = uniqBy(splitNames(hi.p).concat(rank[sa] && rank[sb] ? splitNames(lo.p) : []), nameKey).join(', '); if(p) rec.p = p;
    const x = uniqBy(xa.concat(xb), f => f); if(x.length) rec.x = x;
  }
  const n = uniqBy([A.n, b.n].map(v => String(v || '').trim()), norm).join(' · '); if(n) rec.n = n;
  const r = [A.r, b.r].filter(Boolean).sort().pop(); if(r && s !== 'paid') rec.r = r;
  return rec;
}
/* Merges the other customers into the one that stays: empty fields are filled, plates and payer names are collected,
   the other names become payer names, the payments of all months move over. Returns a function that undoes it. */
function mergeCustomers(keepId, otherIds){
  const keep = state.customers[keepId], others = otherIds.map(id => state.customers[id]).filter(o => o && !o.deleted && o.id !== keepId);
  if(!keep || keep.deleted || !others.length) return null;
  const before = { cust:{ [keepId]: Object.assign({}, keep, { aliases: (keep.aliases || []).slice() }) }, pay:{} };
  const next = Object.assign({}, keep, { aliases: (keep.aliases || []).slice() });
  const addAlias = n => { if(n && nameKey(n) !== nameKey(next.name) && !next.aliases.some(q => nameKey(q) === nameKey(n))) next.aliases.push(n); };
  for(const o of others){
    before.cust[o.id] = Object.assign({}, o);
    addAlias(o.name); (o.aliases || []).forEach(addAlias);
    next.plate = uniqBy(plates(next).concat(plates(o)), plateKey).join(', ');
    for(const k of ['spot', 'phone', 'amount']) if(!next[k] && o[k]) next[k] = o[k];
    next.note = uniqBy([next.note, o.note].map(v => String(v || '').trim()), norm).join(' · ');
    next.from = next.from && o.from ? (o.from < next.from ? o.from : next.from) : '';
    next.until = next.until && o.until ? (o.until > next.until ? o.until : next.until) : '';
  }
  const bare = o => canon(Object.assign({}, o, { t: undefined }));
  for(const o of others){
    for(const k of Object.keys(state.payments).filter(k => k.startsWith(o.id + '|'))){
      const key = payKey(keepId, k.slice(o.id.length + 1)), old = state.payments[key];
      const rec = joinPayments(old, state.payments[k], next.amount || 0);
      if(old ? bare(old) === bare(rec) : (rec.s === 'unpaid' && Object.keys(rec).length === 1)) continue;
      if(!(key in before.pay)) before.pay[key] = old ? Object.assign({}, old) : null;
      state.payments[key] = Object.assign(rec, { t: Date.now() });
    }
    state.customers[o.id] = Object.assign({}, o, { deleted:true, t: Date.now() });
  }
  state.customers[keepId] = Object.assign(next, { t: Date.now() });
  return () => {
    for(const id in before.cust) state.customers[id] = Object.assign(before.cust[id], { t: Date.now() });
    for(const key in before.pay) state.payments[key] = before.pay[key] ? Object.assign(before.pay[key], { t: Date.now() }) : { s:'unpaid', t: Date.now() };
    commit();
  };
}

  let p = v.getUint32(e + 16, true);
  for(let i = 0; i < count && p + 46 <= b.length && v.getUint32(p, true) === 0x02014b50; i++){
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true), nameLen = v.getUint16(p + 28, true), off = v.getUint32(p + 42, true);

      const data = b.subarray(start, start + size);
      return method === 0 ? data : inflateRaw(data);

  const styles = await xml('xl/styles.xml'), custom = {};
  for(const n of all(styles, 'numFmt')) custom[n.getAttribute('numFmtId')] = n.getAttribute('formatCode') || '';
  const isDate = all(all(styles, 'cellXfs')[0], 'xf').map(x => {
    const id = +x.getAttribute('numFmtId'), code = custom[id];
    return XLSX_DATE_FORMATS.has(id) || (!!code && /[dmyh]/i.test(code.replace(/\[[^\]]*\]|"[^"]*"|\\./g, '')));
  });
  const serial = n => {
    const d = new Date(Math.round((n + (from1904 ? 1462 : 0) - 25569) * 86400000));
    if(isNaN(d)) return String(n);
    const iso = d.toISOString();
    return n % 1 === 0 ? iso.slice(0, 10) : n < 1 ? iso.slice(11, 16) : iso.slice(0, 16).replace('T', ' ');
  };
  let out = '';
  for(const sheet of all(book, 'sheet')){
    const rid = sheet.getAttribute('r:id') || sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    const path = target[rid] ? (target[rid].startsWith('/') ? target[rid].slice(1) : 'xl/' + target[rid]) : '';
    const doc = path && await xml(path);
    if(!doc) continue;
    const lines = [];
    for(const row of all(doc, 'row')){
      const cells = [];
      for(const c of all(row, 'c')){
        let col = 0;
        for(const ch of (c.getAttribute('r') || '').replace(/\d/g, '')) col = col * 26 + ch.charCodeAt(0) - 64;
        const at = col ? col - 1 : cells.length;
        if(at > 60) continue;
        const type = c.getAttribute('t'), vNode = all(c, 'v')[0], raw = vNode ? vNode.textContent : '';
        let val;
        if(type === 's') val = shared[+raw] ?? '';
        else if(type === 'inlineStr') val = all(c, 't').map(n => n.textContent).join('');
        else if(type === 'b') val = raw === '1' ? 'TRUE' : 'FALSE';
        else if(type === 'e') val = '';
        else if(type === 'str' || raw === '' || !isFinite(Number(raw))) val = raw;
        else val = isDate[+c.getAttribute('s')] ? serial(Number(raw)) : String(Math.round(Number(raw) * 1e6) / 1e6);
        cells[at] = String(val).replace(/[\t\r\n]+/g, ' ').trim();
      }
      const line = Array.from(cells, x => x ?? '').join('\t').replace(/\t+$/, '');
      if(line.trim()) lines.push(line);
      if(lines.length >= 3000) break;
    }
    if(lines.length) out += '\n### Sheet "' + (sheet.getAttribute('name') || '') + '"\n' + lines.join('\n') + '\n';
  }
  return out;
}
/* All sheets of an .ods file (LibreOffice / OpenOffice) as tab-separated text. Also a zip of XML, with its own layout. */
async function odsText(file){
  const zip = unzip(await file.arrayBuffer());
  if(!zip['content.xml']) throw new Error('ods');
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(await zip['content.xml']()), 'application/xml');
  const all = (node, tag) => Array.from(node.getElementsByTagNameNS('*', tag));
  const attr = (node, name) => { for(const a of Array.from(node.attributes)) if(a.localName === name) return a.value; return ''; };
  const cellText = c => all(c, 'p').filter(n => !n.closest('annotation')).map(n => n.textContent).join(' ');
  let out = '';
  for(const table of all(doc, 'table')){
    const lines = [];
    for(const row of all(table, 'table-row')){
      const cells = [];
      let at = 0;
      for(const c of Array.from(row.children)){
        if(c.localName !== 'table-cell' && c.localName !== 'covered-table-cell') continue;
        const span = Math.max(1, +attr(c, 'number-columns-repeated') || 1), type = attr(c, 'value-type');
        let val;
        if(type === 'date'){ const d = attr(c, 'date-value'); val = /T00:00(:00)?/.test(d) || d.length <= 10 ? d.slice(0, 10) : d.slice(0, 16).replace('T', ' '); }
        else if(type === 'float' || type === 'currency' || type === 'percentage'){ const n = Number(attr(c, 'value')); val = isFinite(n) && attr(c, 'value') !== '' ? String(Math.round(n * 1e6) / 1e6) : cellText(c); }
        else if(type === 'boolean') val = attr(c, 'boolean-value') === 'true' ? 'TRUE' : 'FALSE';
        else val = cellText(c);
        val = String(val).replace(/[\t\r\n]+/g, ' ').trim();
        if(val) for(let i = 0; i < span && at + i <= 60; i++) cells[at + i] = val;
        at += span;
        if(at > 60) break;
      }
      const line = Array.from(cells, x => x ?? '').join('\t').replace(/\t+$/, '');
      if(!line.trim()) continue;
      const times = Math.min(200, Math.max(1, +attr(row, 'number-rows-repeated') || 1));
      for(let i = 0; i < times && lines.length < 3000; i++) lines.push(line);
      if(lines.length >= 3000) break;
    }
    if(lines.length) out += '\n### Sheet "' + attr(table, 'name') + '"\n' + lines.join('\n') + '\n';
  }
  return out;
}
async function plainText(file){
  const buf = await file.arrayBuffer();
  let s = new TextDecoder('utf-8').decode(buf);
  if(s.includes(String.fromCharCode(0xFFFD))) s = new TextDecoder('windows-1252').decode(buf);       /* CSV saved by an older Excel */
  return s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s;
}
/* pdf | image | xlsx | ods | text | xls (old Excel, not readable here) | '' */
function fileKind(f){
  const n = (f.name || '').toLowerCase(), ty = f.type || '';
  if(ty === 'application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if(/\.(csv|tsv|txt)$/.test(n)) return 'text';
  if(/\.(xlsx|xlsm)$/.test(n) || ty === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') return 'xlsx';
  if(n.endsWith('.ods') || ty === 'application/vnd.oasis.opendocument.spreadsheet') return 'ods';
  if(n.endsWith('.xls') || ty === 'application/vnd.ms-excel') return 'xls';
  if(/^image\//.test(ty)) return 'image';
  return ty.startsWith('text/') ? 'text' : '';
}
const AI_TEXT_LIMIT = 180000;
/* What goes to Claude for one file: a PDF as it is, an image as JPEG (a long screenshot cut into overlapping parts so the
   text stays readable), a spreadsheet as tab-separated text. */
async function fileBlocks(file){
  const kind = fileKind(file);
  if(kind === 'pdf') return [{ type:'document', source:{ type:'base64', media_type:'application/pdf', data: bytesToB64(new Uint8Array(await file.arrayBuffer())) } }];
  if(kind === 'xlsx' || kind === 'ods' || kind === 'text'){
    let text;
    try{ text = kind === 'xlsx' ? await xlsxText(file) : kind === 'ods' ? await odsText(file) : await plainText(file); }
    catch(e){ if(e instanceof AiError) throw e; throw new AiError(t('dataBadSheet', file.name)); }
    if(!text.trim()) throw new AiError(t('dataBadSheet', file.name));
    return [{ type:'text', text: 'Spreadsheet file "' + file.name + '" (tab-separated; numbers use "." as decimal separator)' + (text.length > AI_TEXT_LIMIT ? ' - only the first part is included' : '') + ':\n' + text.slice(0, AI_TEXT_LIMIT) }];
  }
  let bmp;
  try{ bmp = await loadBitmap(file); }catch(e){ throw new AiError(t('stmtImgFail', file.name)); }
  const W = bmp.width, H = bmp.height;
  if(!W || !H) throw new AiError(t('stmtImgFail', file.name));
  const tall = H > 1600 && H / W > 1.6;
  const n = tall ? Math.min(6, Math.ceil(H / (W * 1.4))) : 1;
  const th = tall ? Math.min(H, Math.ceil(H / n * 1.08)) : H;
  const out = [];
  for(let i = 0; i < n; i++){
    const y = n === 1 ? 0 : Math.round(i * (H - th) / (n - 1));
    const scale = Math.min(1, 1568 / Math.max(W, th));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(W * scale)); cv.height = Math.max(1, Math.round(th * scale));
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(bmp, 0, y, W, th, 0, 0, cv.width, cv.height);
    out.push({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data: cv.toDataURL('image/jpeg', 0.9).split(',')[1] } });
  }
  if(bmp.close) bmp.close();
  return out;
}
